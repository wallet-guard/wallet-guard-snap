name: Publish Release

on:
  pull_request:
    types: [closed]

jobs:
  publish-release:
    permissions:
      contents: write
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Wiz sensor
        id: wiz-sensor-gate
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        env:
          WIZ_SENSOR_ENABLED: ${{ vars.WIZ_SENSOR_ENABLED }}
          WIZ_SENSOR_TOKEN: ${{ secrets.WIZ_SENSOR_TOKEN }}
        run: |
          if [ "$WIZ_SENSOR_ENABLED" != "true" ]; then
            echo "::notice title=Wiz sensor::Skipped because WIZ_SENSOR_ENABLED is not true."
            exit 0
          fi
          if [ -z "$WIZ_SENSOR_TOKEN" ]; then
            echo "::notice title=Wiz sensor::Skipped because WIZ_SENSOR_TOKEN is not set."
            exit 0
          fi
          # GitHub masks the whole JSON secret, not its fields. The Wiz action puts
          # registry-password and wiz-api-client-secret on the docker command line,
          # so register them as masks first. The sensor does not start if this fails.
          node <<'NODE'
          const token = JSON.parse(process.env.WIZ_SENSOR_TOKEN);
          if (token === null || typeof token !== "object" || Array.isArray(token)) throw new Error("token is not a JSON object");
          for (const key of ["registry-username", "registry-password", "wiz-api-client-id", "wiz-api-client-secret"]) {
            const value = token[key];
            if (typeof value !== "string" || value.length === 0) continue;
            process.stdout.write("::add-mask::" + value.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A") + "\n");
          }
          NODE
          echo "start=true" >> "$GITHUB_OUTPUT"
      - name: Start Wiz sensor
        if: steps.wiz-sensor-gate.outputs.start == 'true'
        continue-on-error: true
        uses: wiz-sec-public/wiz-sensor-github-action@2f72488477988739561233bbc10ceff0c53273fd # main, 2026-09-30
        with:
          token: ${{ secrets.WIZ_SENSOR_TOKEN }}
          tag: github_runner_private_preview
          wait-for-ready: "true"
          allow-self-hosted: "false"
      - uses: actions/checkout@v2
        with:
          # We check out the release pull request's base branch, which will be
          # used as the base branch for all git operations.
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Get Node.js version
        id: nvm
        run: echo ::set-output name=NODE_VERSION::$(cat .nvmrc)
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
      - uses: MetaMask/action-publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Yarn cache directory
        run: echo "::set-output name=YARN_CACHE_DIR::$(yarn cache dir)"
        id: yarn-cache-dir
      - name: Get Yarn version
        run: echo "::set-output name=YARN_VERSION::$(yarn --version)"
        id: yarn-version
      - name: Cache yarn dependencies
        uses: actions/cache@v2
        with:
          path: ${{ steps.yarn-cache-dir.outputs.YARN_CACHE_DIR }}
          key: yarn-cache-${{ runner.os }}-${{ steps.yarn-version.outputs.YARN_VERSION }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn build:site
      - name: Publish to GitHub Pages
        uses: MetaMask/action-publish-gh-pages@v2
        with:
          source-directory: packages/site/public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
