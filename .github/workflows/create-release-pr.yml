name: Create Release Pull Request

on:
  workflow_dispatch:
    inputs:
      base-branch:
        description: 'The base branch for git operations and the pull request.'
        default: 'main'
        required: true
      release-type:
        description: 'A SemVer version diff, i.e. major, minor, patch, prerelease etc. Mutually exclusive with "release-version".'
        required: false
      release-version:
        description: 'A specific version to bump to. Mutually exclusive with "release-type".'
        required: false

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Wiz sensor
        id: wiz-sensor-gate
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        env:
          WIZ_SENSOR_ENABLED: ${{ vars.WIZ_SENSOR_ENABLED }}
          WIZ_SENSOR_TOKEN: ${{ secrets.WIZ_SENSOR_TOKEN }}
        run: |
          if [ "$WIZ_SENSOR_ENABLED" != "true" ]; then
            echo "::notice title=Wiz sensor::Skipped because WIZ_SENSOR_ENABLED is not true."
            exit 0
          fi
          if [ -z "$WIZ_SENSOR_TOKEN" ]; then
            echo "::notice title=Wiz sensor::Skipped because WIZ_SENSOR_TOKEN is not set."
            exit 0
          fi
          # GitHub masks the whole JSON secret, not its fields. The Wiz action puts
          # registry-password and wiz-api-client-secret on the docker command line,
          # so register them as masks first. The sensor does not start if this fails.
          node <<'NODE'
          const token = JSON.parse(process.env.WIZ_SENSOR_TOKEN);
          if (token === null || typeof token !== "object" || Array.isArray(token)) throw new Error("token is not a JSON object");
          for (const key of ["registry-username", "registry-password", "wiz-api-client-id", "wiz-api-client-secret"]) {
            const value = token[key];
            if (typeof value !== "string" || value.length === 0) continue;
            process.stdout.write("::add-mask::" + value.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A") + "\n");
          }
          NODE
          echo "start=true" >> "$GITHUB_OUTPUT"
      - name: Start Wiz sensor
        if: steps.wiz-sensor-gate.outputs.start == 'true'
        continue-on-error: true
        uses: wiz-sec-public/wiz-sensor-github-action@2f72488477988739561233bbc10ceff0c53273fd # main, 2026-09-30
        with:
          token: ${{ secrets.WIZ_SENSOR_TOKEN }}
          tag: github_runner_private_preview
          wait-for-ready: "true"
          allow-self-hosted: "false"
      - uses: actions/checkout@v2
        with:
          # This is to guarantee that the most recent tag is fetched.
          # This can be configured to a more reasonable value by consumers.
          fetch-depth: 0
          # We check out the specified branch, which will be used as the base
          # branch for all git operations and the release PR.
          ref: ${{ github.event.inputs.base-branch }}
      - name: Get Node.js version
        id: nvm
        run: echo ::set-output name=NODE_VERSION::$(cat .nvmrc)
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
      - uses: MetaMask/action-create-release-pr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release-type: ${{ github.event.inputs.release-type }}
          release-version: ${{ github.event.inputs.release-version }}
          artifacts-path: gh-action__release-authors
      # Upload the release author artifact for use in subsequent workflows
      - uses: actions/upload-artifact@v2
        with:
          name: release-authors
          path: gh-action__release-authors
          if-no-files-found: error
